build_node_mxe:
  stage: build
  script:
  - export PATH=/opt/mxe/usr/bin:$PATH
  - export CCACHE_DIR="$CI_PROJECT_DIR/build-mxe-ccache"
  - cd core && ./Node/deploy/build-windows-embedded-mxe.sh && cd ..
  - mkdir -p bin
  - cp core/bin/onmydisk.exe core/Node/deploy/install-onmydisk.ps1 core/run/etc/config/onmydisk.conf bin/
  - |-
    # Package AI Assistant directly from monorepo ai/ directory
    ./core/Node/deploy/package-onmychat-win.sh "$CI_PROJECT_DIR/ai" bin/onmychat-latest.zip
  # publish from the same runner that has repo@forge keys (same as build_tunnel_mxe)
  - 'echo "== PUBLISH 1/3 - node exe, installer, config"'
  - |-
    scp -o StrictHostKeyChecking=accept-new \
        bin/onmydisk.exe \
        repo@forge.disk.direct:/opt/repo/Windows/onmydisk-node-latest-x64.exe
  - |-
    scp -o StrictHostKeyChecking=accept-new \
        bin/install-onmydisk.ps1 \
        bin/onmydisk.conf \
        repo@forge.disk.direct:/opt/repo/Windows/
  - 'echo "== PUBLISH 2/3 - onmychat zip"'
  - |-
    if [ -f bin/onmychat-latest.zip ]; then
      scp -o StrictHostKeyChecking=accept-new \
          bin/onmychat-latest.zip \
          repo@forge.disk.direct:/opt/repo/Windows/
      scp -o StrictHostKeyChecking=accept-new \
          bin/onmychat-latest.zip \
          repo@forge.disk.direct:/opt/repo/OnMyChat/
    fi
  - 'echo "== PUBLISH 3/3 - verify files on server (job fails if missing)"'
  - |-
    ssh -o StrictHostKeyChecking=accept-new repo@forge.disk.direct \
        "ls -la /opt/repo/Windows/ | grep -E 'onmydisk-node-latest-x64|install-onmydisk\.ps1|onmydisk\.conf|onmychat'"
  cache:
    key: libdatachannel-build-mxe
    paths:
    - core/libdatachannel/build-mxe/
  tags:
  - linux
  when: manual
  artifacts:
    name: omd-node-win
    paths:
    - bin/onmydisk.exe
    - bin/install-onmydisk.ps1
    - bin/onmydisk.conf
    - bin/onmychat-latest.zip
    expire_in: 1 week


build_node_macos:
  stage: build
  image: node:20-bookworm
  tags:
    - linux
  script:
    - which jq >/dev/null || (apt-get update && apt-get install -y jq curl unzip)
    - which unzip >/dev/null || (apt-get update && apt-get install -y unzip)
    - |
      CM_TOKEN="${CODEMAGIC_API_TOKEN:-}"
      if [ -z "$CM_TOKEN" ] && [ -f "/home/alexey/projects/omd/etc/codemagic.token" ]; then
        CM_TOKEN="$(tr -d '[:space:]' < /home/alexey/projects/omd/etc/codemagic.token)"
      fi
      if [ -z "$CM_TOKEN" ]; then
        echo "ERROR: CODEMAGIC_API_TOKEN is not set and /home/alexey/projects/omd/etc/codemagic.token not found"
        exit 1
      fi
      echo "Triggering Codemagic macOS Node & Tunnel build for branch ${CI_COMMIT_REF_NAME}..."
      RESPONSE=$(curl -s -X POST https://api.codemagic.io/builds \
        -H "Content-Type: application/json" \
        -H "x-auth-token: ${CM_TOKEN}" \
        --data "{\"appId\": \"6abe4c845eb3cd34fe4cc074\", \"workflowId\": \"macos-node-workflow\", \"branch\": \"${CI_COMMIT_REF_NAME}\", \"environment\": {\"variables\": {\"BUILD_VERSION\": \"${CI_PIPELINE_ID}\"}}}")
      BUILD_ID=$(echo "$RESPONSE" | jq -r '.buildId // empty')
      if [ -z "$BUILD_ID" ]; then
        echo "Failed to start Codemagic macOS build: $RESPONSE"
        exit 1
      fi
      echo "Codemagic macOS build started! Build ID: $BUILD_ID"
      echo "Live build logs: https://codemagic.io/app/6abe4c845eb3cd34fe4cc074/build/$BUILD_ID"
      echo "Waiting for macOS arm64 Node & Tunnel build to complete..."
      while true; do
        sleep 25
        BUILD_INFO=$(curl -s -H "x-auth-token: ${CM_TOKEN}" "https://api.codemagic.io/builds/$BUILD_ID")
        STATUS=$(echo "$BUILD_INFO" | jq -r '.build.status // empty')
        echo "Current Codemagic status: $STATUS"
        if [ "$STATUS" = "finished" ]; then
          echo "macOS Node build completed successfully!"
          ART_URL=$(echo "$BUILD_INFO" | jq -r '.build.artefacts[]? | select((.name | endswith(".tar.gz")) or (.type == "bundle") or (.name | endswith(".zip"))) | .url // empty' | head -n 1)
          ART_NAME=$(echo "$BUILD_INFO" | jq -r '.build.artefacts[]? | select((.name | endswith(".tar.gz")) or (.type == "bundle") or (.name | endswith(".zip"))) | .name // empty' | head -n 1)
          if [ -z "$ART_URL" ]; then
            echo "ERROR: Codemagic finished without producing a macOS bundle artifact! Check logs: https://codemagic.io/app/6abe4c845eb3cd34fe4cc074/build/$BUILD_ID"
            exit 1
          fi
          mkdir -p bin build_macos_tmp
          curl -fsSL -H "x-auth-token: ${CM_TOKEN}" "$ART_URL" -o "build_macos_tmp/${ART_NAME}"
          if echo "$ART_NAME" | grep -q '\.zip$'; then
            unzip -q -o "build_macos_tmp/${ART_NAME}" -d build_macos_tmp/extracted
            TAR_FILE=$(find build_macos_tmp/extracted -name "onmydisk-node-macos-*.tar.gz" | head -n 1)
            if [ -z "$TAR_FILE" ]; then
              echo "ERROR: No onmydisk-node-macos-*.tar.gz found inside ${ART_NAME}!"
              exit 1
            fi
            cp "$TAR_FILE" bin/onmydisk-node-macos-arm64.tar.gz
          else
            cp "build_macos_tmp/${ART_NAME}" bin/onmydisk-node-macos-arm64.tar.gz
          fi
          rm -rf build_macos_tmp
          cp core/Node/deploy/install-onmydisk-macos.sh bin/install-onmydisk.sh
          chmod 664 bin/onmydisk-node-macos-arm64.tar.gz
          chmod 775 bin/install-onmydisk.sh
          ssh -o StrictHostKeyChecking=accept-new repo@forge.disk.direct "mkdir -p /opt/repo/macOS"
          scp -o StrictHostKeyChecking=accept-new bin/onmydisk-node-macos-arm64.tar.gz bin/install-onmydisk.sh repo@forge.disk.direct:/opt/repo/macOS/
          ssh -o StrictHostKeyChecking=accept-new repo@forge.disk.direct "chmod 664 /opt/repo/macOS/onmydisk-node-macos-arm64.tar.gz && chmod 775 /opt/repo/macOS/install-onmydisk.sh && ls -lh /opt/repo/macOS/"
          break
        elif [ "$STATUS" = "failed" ] || [ "$STATUS" = "canceled" ]; then
          echo "macOS Node build $STATUS! Check logs: https://codemagic.io/app/6abe4c845eb3cd34fe4cc074/build/$BUILD_ID"
          exit 1
        fi
      done
  artifacts:
    name: omd-node-macos
    paths:
      - bin/onmydisk-node-macos-arm64.tar.gz
      - bin/install-onmydisk.sh
    expire_in: 1 week
  when: manual


# ==============================================================================
# Mobile & OTA Live Update Jobs (Capacitor)
# ==============================================================================

.android-common-setup: &android-common-setup
  stage: mobile
  image: node:20-bookworm
  tags:
    - linux
  before_script:
    # 1. Resolve Java Runtime Environment
    - if [ -d "/home/alexey/projects/jdk-17" ]; then
        export JAVA_HOME="/home/alexey/projects/jdk-17";
        export PATH="$JAVA_HOME/bin:$PATH";
        echo "Using local user-space JDK 17";
      elif [ -x "$(command -v apt-get)" ] && [ "$(id -u)" = "0" ]; then
        apt-get update && apt-get install -y openjdk-17-jdk;
      fi
    # 2. Resolve Android SDK
    - if [ -d "/home/alexey/projects/android-sdk" ]; then
        export ANDROID_HOME="/home/alexey/projects/android-sdk";
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH";
        echo "Using local user-space Android SDK";
      elif [ -x "$(command -v apt-get)" ] && [ "$(id -u)" = "0" ]; then
        apt-get update && apt-get install -y wget unzip;
        mkdir -p /opt/android-sdk/cmdline-tools;
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip;
        unzip -q /tmp/cmdline-tools.zip -d /opt/android-sdk/cmdline-tools;
        mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest;
        export ANDROID_HOME="/opt/android-sdk";
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH";
        yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses;
        sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.0.0";
      fi
    # 3. Build Svelte Static Frontend in web
    #    (no pre-compressed .gz siblings: Android AAPT2 rejects foo.js.gz as a
    #     duplicate resource of foo.js — gzip is applied by the nginx proxy anyway)
    - cd web
    - npm install --legacy-peer-deps
    - export MOBILE_BUILD_NUM=$((6000 + ${CI_PIPELINE_IID:-0}))
    - export VITE_APP_VERSION="3.1.${MOBILE_BUILD_NUM}"
    - COMPRESS_ASSETS=0 npm run build
    # 4. Sync Capacitor Web Assets to Native Project
    - cd ../mobile
    - npm install
    - if [ ! -f android/app/google-services.json ]; then if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then if [ -f "${GOOGLE_SERVICES_JSON}" ]; then cp "${GOOGLE_SERVICES_JSON}" android/app/google-services.json; else printf "%s" "${GOOGLE_SERVICES_JSON}" > android/app/google-services.json; fi; elif [ -f "/home/alexey/projects/omd/etc/fcm/google-services.json" ]; then cp "/home/alexey/projects/omd/etc/fcm/google-services.json" android/app/google-services.json; echo "Copied local FCM google-services.json"; fi; fi
    - npx cap sync android
    - chmod +x android/gradlew || true

build-android:
  <<: *android-common-setup
  script:
    # 5. Compile Android APK (signed release if keystore present, else debug)
    - export MOBILE_BUILD_NUM=$((6000 + ${CI_PIPELINE_IID:-0}))
    - cd android
    - ./gradlew --stop
    - ./gradlew clean
    - export BUILD_NUMBER=${MOBILE_BUILD_NUM}
    - if [ -f "/home/alexey/projects/omd/etc/android/keystore.properties" ] || [ -n "${KEYSTORE_PROPERTIES:-}" ]; then
        ./gradlew assembleRelease;
      else
        ./gradlew assembleDebug;
      fi
    - cd ..
    # 6. Copy final APK artifact
    - mkdir -p build_android
    - if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
        cp android/app/build/outputs/apk/release/app-release.apk build_android/DiskDirect.apk;
      else
        cp android/app/build/outputs/apk/debug/app-debug.apk build_android/DiskDirect.apk;
      fi
    - chmod 664 build_android/DiskDirect.apk
    # 7. Upload to central binary repository
    - ssh -o StrictHostKeyChecking=no repo@forge.disk.direct "mkdir -p /opt/repo/DiskDirect/Android"
    - scp -o StrictHostKeyChecking=no build_android/DiskDirect.apk repo@forge.disk.direct:/opt/repo/DiskDirect/Android/DiskDirect.apk
    - ssh -o StrictHostKeyChecking=no repo@forge.disk.direct "chmod 664 /opt/repo/DiskDirect/Android/DiskDirect.apk"
  artifacts:
    name: disk-direct-android-apk
    paths:
      - mobile/build_android/DiskDirect.apk
    expire_in: 1 week
  when: manual

build-android-play:
  <<: *android-common-setup
  script:
    # 5. Verify Google Play Upload Keystore & compile signed Android App Bundle (.aab)
    - export MOBILE_BUILD_NUM=$((6000 + ${CI_PIPELINE_IID:-0}))
    - |
      if [ -n "${KEYSTORE_PROPERTIES:-}" ] && [ ! -f "${KEYSTORE_PROPERTIES}" ]; then
        printf "%s" "${KEYSTORE_PROPERTIES}" > android/keystore.properties
        chmod 600 android/keystore.properties
      fi
      if [ ! -f "/home/alexey/projects/omd/etc/android/keystore.properties" ] && [ ! -f "android/keystore.properties" ] && [ -z "${KEYSTORE_PROPERTIES:-}" ]; then
        echo "ERROR: Release signing keystore.properties not found (/home/alexey/projects/omd/etc/android/keystore.properties or KEYSTORE_PROPERTIES)!"
        exit 1
      fi
    - cd android
    - ./gradlew --stop
    - ./gradlew clean
    - export BUILD_NUMBER=${MOBILE_BUILD_NUM}
    - ./gradlew bundleRelease
    - jarsigner -verify app/build/outputs/bundle/release/app-release.aab
    - cd ..
    # 6. Copy signed Google Play AAB artifact
    - mkdir -p build_android
    - cp android/app/build/outputs/bundle/release/app-release.aab build_android/DiskDirect.aab
    - cp android/app/build/outputs/bundle/release/app-release.aab "build_android/DiskDirect-3.1.${MOBILE_BUILD_NUM}-release.aab"
    - chmod 664 build_android/*.aab
    # 7. Upload to central binary repository
    - ssh -o StrictHostKeyChecking=no repo@forge.disk.direct "mkdir -p /opt/repo/DiskDirect/Android"
    - scp -o StrictHostKeyChecking=no build_android/DiskDirect.aab repo@forge.disk.direct:/opt/repo/DiskDirect/Android/DiskDirect.aab
    - ssh -o StrictHostKeyChecking=no repo@forge.disk.direct "chmod 664 /opt/repo/DiskDirect/Android/DiskDirect.aab"
  artifacts:
    name: "disk-direct-google-play-3.1.${CI_PIPELINE_IID}"
    paths:
      - mobile/build_android/DiskDirect.aab
      - mobile/build_android/DiskDirect-3.1.*-release.aab
    expire_in: 2 weeks
  when: manual

build-ios:
  stage: mobile
  image: node:20-bookworm
  tags:
    - linux
  script:
    - which jq >/dev/null || (apt-get update && apt-get install -y jq curl)
    - export MOBILE_BUILD_NUM=$((6000 + ${CI_PIPELINE_IID:-0}))
    - echo "Triggering Codemagic iOS cloud build for branch ${CI_COMMIT_REF_NAME} (build ${MOBILE_BUILD_NUM})..."
    - |
      CM_TOKEN="${CODEMAGIC_API_TOKEN:-}"
      if [ -z "$CM_TOKEN" ] && [ -f "/home/alexey/projects/omd/etc/codemagic.token" ]; then
        CM_TOKEN="$(tr -d '[:space:]' < /home/alexey/projects/omd/etc/codemagic.token)"
      fi
      RESPONSE=$(curl -s -X POST https://api.codemagic.io/builds \
        -H "Content-Type: application/json" \
        -H "x-auth-token: ${CM_TOKEN}" \
        --data "{\"appId\": \"6abe4c845eb3cd34fe4cc074\", \"workflowId\": \"ios-workflow\", \"branch\": \"${CI_COMMIT_REF_NAME}\", \"environment\": {\"variables\": {\"BUILD_NUMBER\": \"${MOBILE_BUILD_NUM}\"}}}")
      BUILD_ID=$(echo "$RESPONSE" | jq -r '.buildId // empty')
      if [ -z "$BUILD_ID" ]; then
        echo "Failed to start Codemagic build: $RESPONSE"
        exit 1
      fi
      echo "Codemagic build started successfully! Build ID: $BUILD_ID"
      echo "Live build logs: https://codemagic.io/app/6abe4c845eb3cd34fe4cc074/build/$BUILD_ID"
      echo "Waiting for iOS build to complete on macOS runner..."
      while true; do
        sleep 25
        BUILD_INFO=$(curl -s -H "x-auth-token: ${CM_TOKEN}" "https://api.codemagic.io/builds/$BUILD_ID")
        STATUS=$(echo "$BUILD_INFO" | jq -r '.build.status // empty')
        echo "Current Codemagic status: $STATUS"
        if [ "$STATUS" = "finished" ]; then
          echo "iOS build completed successfully!"
          IPA_URL=$(echo "$BUILD_INFO" | jq -r '.build.artefacts[]? | select(.name | endswith(".ipa")) | .url // empty' | head -n 1)
          if [ -n "$IPA_URL" ]; then
            mkdir -p build_ios
            curl -fsSL -H "x-auth-token: ${CM_TOKEN}" "$IPA_URL" -o build_ios/DiskDirect.ipa
            chmod 664 build_ios/DiskDirect.ipa
            echo "Downloaded IPA to build_ios/DiskDirect.ipa"
            ssh -o StrictHostKeyChecking=no repo@forge.disk.direct "mkdir -p /opt/repo/DiskDirect/iOS" || true
            scp -o StrictHostKeyChecking=no build_ios/DiskDirect.ipa repo@forge.disk.direct:/opt/repo/DiskDirect/iOS/DiskDirect.ipa || true
            ssh -o StrictHostKeyChecking=no repo@forge.disk.direct "chmod 664 /opt/repo/DiskDirect/iOS/DiskDirect.ipa" || true
          else
            echo "ERROR: Codemagic finished without producing an IPA artifact! Check logs: https://codemagic.io/app/6abe4c845eb3cd34fe4cc074/build/$BUILD_ID"
            exit 1
          fi
          break
        elif [ "$STATUS" = "failed" ] || [ "$STATUS" = "canceled" ]; then
          echo "iOS build $STATUS! Check logs: https://codemagic.io/app/6abe4c845eb3cd34fe4cc074/build/$BUILD_ID"
          exit 1
        fi
      done
  artifacts:
    paths:
      - build_ios/*.ipa
    expire_in: 1 week
  when: manual

deploy_mobile_ota:
  stage: deploy
  tags:
    - linux
  script:
    # 1. Install zip if not present
    - if ! [ -x "$(command -v zip)" ]; then
        if [ -x "$(command -v apt-get)" ] && [ "$(id -u)" = "0" ]; then
          apt-get update && apt-get install -y zip;
        fi
      fi
    # 2. Build Svelte Static Frontend in web
    #    (no .gz siblings in the OTA bundle — dead weight for WebView)
    - export MOBILE_BUILD_NUM=$((6000 + ${CI_PIPELINE_IID:-0}))
    - cd web
    - npm install --legacy-peer-deps
    - export VITE_APP_VERSION="3.1.${MOBILE_BUILD_NUM}"
    - COMPRESS_ASSETS=0 npm run build
    # 3. Zip the Svelte static build files (from web/dist), excluding heavy unchanged WASM suites
    - cd dist
    - zip -r ../../direct-frontend.zip . -x "*.map" -x "*tracemonkey*" -x "wordcraft/*" -x "deckcraft/*" -x "gridcraft/*"
    - cd ../..
    # 4. Upload zip to central binary repository for live updates
    - ssh -o StrictHostKeyChecking=no repo@forge.disk.direct "mkdir -p /opt/repo/DiskDirect/Android"
    - scp -o StrictHostKeyChecking=no direct-frontend.zip repo@forge.disk.direct:/opt/repo/DiskDirect/Android/direct-frontend.zip
    # 5. Generate and upload version.json for OTA live update check
    - echo "{\"version\":\"3.1.${MOBILE_BUILD_NUM}\"}" > version.json
    - scp -o StrictHostKeyChecking=no version.json repo@forge.disk.direct:/opt/repo/DiskDirect/version.json
    - scp -o StrictHostKeyChecking=no version.json repo@forge.disk.direct:/opt/repo/DiskDirect/Android/version.json
  when: manual

