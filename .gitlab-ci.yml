build_gun_hub_docker:
  stage: build
  script:
  - pushd services/gun-hub
  - docker build -t omd-gun-hub:latest .
  - docker tag omd-gun-hub:latest onmydisk/omd-gun-hub:latest
  - DOCKER_CONFIG=/home/gitlab-runner/docker-onmydisk docker push onmydisk/omd-gun-hub:latest
  - popd
  tags:
  - linux, docker
  when: manual

deploy_gun_hub:
  stage: deploy
  tags:
    - linux
  script:
    # Execute deployment commands remotely against the combined compose.
    # 1. Create directory for hub sources inside the integration tree
    - ssh -p 30333 -o StrictHostKeyChecking=no $DEPLOY_USER@disk.direct "mkdir -p /root/direct/gun-hub"

    # 1a. Keep the combined compose file up to date
    - rsync -avz -e "ssh -p 30333 -o StrictHostKeyChecking=no" docker-compose.yml $DEPLOY_USER@disk.direct:/root/direct/

    # 1b. One-time migration of GunDB data from the old standalone location
    - ssh -p 30333 -o StrictHostKeyChecking=no $DEPLOY_USER@disk.direct "if [ -d /root/direct/gun-hub/data ] && [ ! -d /root/direct/gun-hub/data ]; then cp -a /root/direct/gun-hub/data /root/direct/gun-hub/data; echo 'migrated gun-hub data'; fi"

    # 2. Sync Hub sources
    - rsync -avz -e "ssh -p 30333 -o StrictHostKeyChecking=no" --exclude 'node_modules' --exclude '.git' --exclude 'data' services/gun-hub/ $DEPLOY_USER@disk.direct:/root/direct/gun-hub/

    # 3. Remove any leftover container from the old standalone deployment
    - ssh -p 30333 -o StrictHostKeyChecking=no $DEPLOY_USER@disk.direct "docker rm -f omd-gun-hub || true"

    # 4. Build (utilizing docker cache) and start the hub service
    - ssh -p 30333 -o StrictHostKeyChecking=no $DEPLOY_USER@disk.direct "
        cd /root/direct &&
        docker-compose build omd-gun-hub &&
        docker-compose up -d omd-gun-hub"

  when: manual








