build_connector_amd64_deb:
  stage: build
  script:
  # Build against Ubuntu 22.04 (glibc 2.35 + OpenSSL 3 / libssl.so.3) so the
  # resulting .deb runs cleanly on Ubuntu 22.04, Ubuntu 24.04+, and Debian 12+.
  # Prebuilt libdatachannel/juice/usrsctp live on the runner at /opt/omd-libdatachannel.
  - docker image inspect omd-deb-builder:jammy >/dev/null 2>&1 || docker build -t omd-deb-builder:jammy -f core/Node/deploy/Dockerfile.deb-builder core/Node/deploy
  - docker run --rm --user $(id -u):$(id -g) -v "$(pwd)/core":/onmydisk -v /opt/omd-libdatachannel:/opt/omd-libdatachannel:ro omd-deb-builder:jammy bash -c "cd /onmydisk && rm -rf build_deb_amd64 && mkdir -p build_deb_amd64 && cd build_deb_amd64 && qmake CONFIG+=DEPLOY CONFIG+=release DEFINES+=_ISOC23_SOURCE=0 DEFINES+=P2P_ENABLED DEFINES+=RTC_STATIC LDATACHANNEL_ROOT=/opt/omd-libdatachannel/x86_64 BUILD_VERSION=$CI_PIPELINE_ID ../Node.pro && make -j\$(nproc)"
  - pushd core/Node
  - fpm -s dir -t deb -a x86_64 -n onmydisk-connector --description "Direct Node Connector" --depends "samba,udisks2,libstdc++6,libssl3 | libssl3t64,libgl1,libegl1,libglu1-mesa,libxcb-xkb1,libxcb-xinerama0,libxcb-xinput0,libz1,libxkbcommon0,libxkbcommon-x11-0,libxrender1,libtag1v5,libpcre2-16-0,libcrypt1,ffmpeg,ruby-full,build-essential,zlib1g-dev,libqt5core5a | libqt5core5t64,libqt5network5 | libqt5network5t64,libqt5websockets5,libqt5widgets5 | libqt5widgets5t64,libqt5sql5 | libqt5sql5t64,libqt5webchannel5,poppler-utils,pandoc,rclone" --license "Apache" -v "3.1.5.$CI_PIPELINE_ID" --after-install after-install.sh -C target
  - scp onmydisk-connector_"3.1.5.$CI_PIPELINE_ID"_amd64.deb repo@forge.disk.direct:/opt/repo/Ubuntu/focal/onmydisk-connector-amd64.deb
  - ssh -o StrictHostKeyChecking=no repo@forge.disk.direct "mkdir -p /opt/repo/OnMyDisk/Connector"
  - scp -o StrictHostKeyChecking=no onmydisk-connector_"3.1.5.$CI_PIPELINE_ID"_amd64.deb repo@forge.disk.direct:/opt/repo/OnMyDisk/Connector/onmydisk-connector-amd64.deb
  - popd
  tags:
  - deb
  when: manual
  artifacts:
    paths:
    - core/Node/*.deb
    expire_in: 1 week


build_connector_arm64_deb:
  stage: build
  variables:
    KIT_ARCH: armv_8
    KIT_TARGET: FIREFLY
    STAGING_DIR: /opt/sysroot/firefly-arm64-sysroot-20.04/
    QMAKE_FIREFLY: /opt/firefly_qt5.15.2_arm64_20.04/host/bin/qmake
    KIT_INCLUDE: /opt/sysroot/firefly-arm64-sysroot-20.04/usr/include/
  script:
  # Prebuilt arm64 libdatachannel/juice/usrsctp live on the runner at
  # /opt/omd-libdatachannel/arm64 (already built, NOT rebuilt here).
  - mkdir -p build_arm64
  - pushd build_arm64
  - 'eval $QMAKE_FIREFLY CONFIG+=DEPLOY DEFINES+=_ISOC23_SOURCE=0 DEFINES+=P2P_ENABLED DEFINES+=RTC_STATIC LDATACHANNEL_ROOT=/opt/omd-libdatachannel/arm64 BUILD_VERSION=$CI_PIPELINE_ID ../core/Node.pro'
  - make
  - popd
  - pushd core/Node
  - fpm -s dir -t deb -a arm64 -n onmydisk-connector --description "Direct Node Connector" --depends "samba,udisks2,libstdc++6,libgl1,libegl1,libglu1-mesa,libxcb-xkb1,libxcb-xinerama0,libxcb-xinput0,libz1,libxkbcommon0,libxkbcommon-x11-0,libxrender1,libtag1v5,libpcre2-16-0,libcrypt1,ffmpeg,ruby-full,build-essential,zlib1g-dev,libqt5core5a | libqt5core5t64,libqt5network5 | libqt5network5t64,libqt5websockets5,libqt5widgets5 | libqt5widgets5t64,libqt5sql5 | libqt5sql5t64,libqt5webchannel5,poppler-utils,pandoc,rclone" --license "Apache" -v "3.1.5.$CI_PIPELINE_ID" --after-install after-install.sh -C target
  - scp onmydisk-connector_"3.1.5.$CI_PIPELINE_ID"_arm64.deb repo@forge.disk.direct:/opt/repo/Ubuntu/focal/onmydisk-connector-arm64.deb
  - ssh -o StrictHostKeyChecking=no repo@forge.disk.direct "mkdir -p /opt/repo/OnMyDisk/Connector"
  - scp -o StrictHostKeyChecking=no onmydisk-connector_"3.1.5.$CI_PIPELINE_ID"_arm64.deb repo@forge.disk.direct:/opt/repo/OnMyDisk/Connector/onmydisk-connector-arm64.deb
  - popd
  tags:
  - deb
  when: manual
  artifacts:
    paths:
    - core/Node/*.deb
    expire_in: 1 week

deploy_connector_ota:
  stage: deploy
  tags:
    - linux
  script:
    - ssh -o StrictHostKeyChecking=no repo@forge.disk.direct "mkdir -p /opt/repo/OnMyDisk/Connector"
    - |
      ssh -o StrictHostKeyChecking=no repo@forge.disk.direct bash -c "'
        cd /opt/repo/OnMyDisk/Connector
        AMD64_SHA=\$(sha256sum onmydisk-connector-amd64.deb 2>/dev/null | cut -d\" \" -f1 || echo \"\")
        ARM64_SHA=\$(sha256sum onmydisk-connector-arm64.deb 2>/dev/null | cut -d\" \" -f1 || echo \"\")
        ARMHF_SHA=\$(sha256sum onmydisk-connector-armhf.deb 2>/dev/null | cut -d\" \" -f1 || echo \"\")
        cat <<EOF > version.json
      {
        \"version\": \"3.1.5.${CI_PIPELINE_ID}\",
        \"build\": ${CI_PIPELINE_ID},
        \"packages\": {
          \"x86_64\": {
            \"url\": \"https://forge.disk.direct/repo/OnMyDisk/Connector/onmydisk-connector-amd64.deb\",
            \"sha256\": \"\$AMD64_SHA\"
          },
          \"aarch64\": {
            \"url\": \"https://forge.disk.direct/repo/OnMyDisk/Connector/onmydisk-connector-arm64.deb\",
            \"sha256\": \"\$ARM64_SHA\"
          },
          \"armv7l\": {
            \"url\": \"https://forge.disk.direct/repo/OnMyDisk/Connector/onmydisk-connector-armhf.deb\",
            \"sha256\": \"\$ARMHF_SHA\"
          }
        }
      }
      EOF
      '"
  when: manual



build_direct:
  stage: build
  script:
  - pushd web
  - npm i --legacy-peer-deps
  - npm run build
  - popd
  - rm -rf core/build/Node
  - docker run --rm --user $(id -u):$(id -g) -v "$(pwd)/core":/onmydisk -v "$(pwd)/web":/web onmydisk/omd-builder:latest /onmydisk/omd-tunnel/deploy/setup-libdatachannel.sh || (cd core && ./omd-tunnel/deploy/setup-libdatachannel.sh)
  - docker run -v $(pwd)/core:/onmydisk -v $(pwd)/web:/web --user $(id -u gitlab-runner):$(id -g gitlab-runner) -e buildversion=$CI_PIPELINE_ID -e buildproject=Gateway.pro onmydisk/omd-builder:latest
  - docker build -t onmydisk:direct .
  - docker tag onmydisk:direct onmydisk/onmydisk:direct
  - DOCKER_CONFIG=/home/gitlab-runner/docker-onmydisk docker push onmydisk/onmydisk:direct
  only:
    variables:
      - $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "direct"
  tags:
  - linux, docker
  when: manual

deploy_direct:
  stage: deploy
  only:
    variables:
      - $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "direct"
  dependencies: []
  script:
    - pushd web && npm i --legacy-peer-deps && npm run build && popd
    - rm -rf core/build/Node
    - docker run --rm --user $(id -u):$(id -g) -v "$(pwd)/core":/onmydisk -v "$(pwd)/web":/web onmydisk/omd-builder:latest /onmydisk/omd-tunnel/deploy/setup-libdatachannel.sh || (cd core && ./omd-tunnel/deploy/setup-libdatachannel.sh)
    - docker run --rm --user $(id -u):$(id -g) -v $(pwd)/core:/onmydisk -v $(pwd)/web:/web -e buildversion=$CI_PIPELINE_ID -e buildproject=Gateway.pro onmydisk/omd-builder:latest
    - ssh -p 30333 -o StrictHostKeyChecking=no $DEPLOY_USER@disk.direct "mkdir -p /root/direct/bin /root/direct/www"
    - rsync -avz -e "ssh -p 30333 -o StrictHostKeyChecking=no" docker-compose.yml $DEPLOY_USER@disk.direct:/root/direct/
    - rsync -avz -e "ssh -p 30333 -o StrictHostKeyChecking=no" services/coturn/ $DEPLOY_USER@disk.direct:/root/direct/coturn/
    - rsync -avz -e "ssh -p 30333 -o StrictHostKeyChecking=no" core/run/bin/omd-server $DEPLOY_USER@disk.direct:/root/direct/bin/
    - rsync -avzc -e "ssh -p 30333 -o StrictHostKeyChecking=no" --delete web/dist/ $DEPLOY_USER@disk.direct:/root/direct/www/
    - ssh -p 30333 -o StrictHostKeyChecking=no $DEPLOY_USER@disk.direct "cd /root/direct && docker-compose up -d onmydisk-server && docker-compose restart onmydisk-server"
  tags:
    - linux
  when: manual

deploy_direct_front:
  stage: deploy
  only:
    variables:
      - $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "direct"
  dependencies: []
  script:
    - pushd web && npm i --legacy-peer-deps && npm run build && popd
    - ssh -p 30333 -o StrictHostKeyChecking=no $DEPLOY_USER@disk.direct "mkdir -p /root/direct/www"
    - rsync -avzc -e "ssh -p 30333 -o StrictHostKeyChecking=no" --delete web/dist/ $DEPLOY_USER@disk.direct:/root/direct/www/
