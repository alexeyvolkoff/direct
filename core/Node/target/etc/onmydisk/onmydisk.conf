[General]
AiServer=http://localhost:4000

[Devices]
IgnoredDevices="/dev/mmcblk0,/dev/zram"

[FileNode]
Port=8082

[Network]
CA=ssl/rootCA.crt
Cert=ssl/user.crt
TreatSslErrorsAsWarnings=true
connect=true
host=disk.direct
pKey=ssl/user.key
pKeyPass='onmydisk'
port=9010

[Settings]
GuestPairing=true
aiBase=http://localhost:4000
aiProvider=hybrid
automount=false
autoreindex=false
downscaleImages=true
generateIconsFromVideos=true
generateThumbs=true
hordeApiKey=0000000000
hordeModel=aphrodite/TheDrummer/Behemoth-X-123B-v2.1
hostname=
language=en
linkId=
localAI=true
localSearch=false
localSearchBase=http://localhost:9090
omdToken=
omdUser=
port=9010
proxyHost=
proxyPassword=
proxyPort=1080
proxyUser=
rcloneShares=[]
rcloneWebdavPort=0
scaleTo=960
secure=true
server=disk.direct
sharedWith=
sitesEnabled=false
sitesRoot=/var/onmydisk/sites
syncPaths=
updateSamba=false
useProxy=false

[logging]
bufferSize=100
maxBackups=2
maxSize=1000000
minLevel=5
msgFormat={timestamp} {typeNr} {type} {thread} {msg}
timestampFormat=dd.MM.yyyy hh:mm:ss.zzz

[sessions]
cookieComment=On My Disk local user
cookieName=sessionid
cookiePath=/
expirationTime=3600000

[templates]
cacheSize=1000000
cacheTime=60000
encoding=UTF-8
suffix=.html
