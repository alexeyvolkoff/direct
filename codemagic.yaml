workflows:
  ios-workflow:
    name: Disk Direct iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: omd_key
    environment:
      ios_signing:
        provisioning_profiles:
          - net_onmydisk_app
        certificates:
          - certificate: "Apple Distribution (omd_key)"
            environment_variable: CM_DIST_CERT_PATH
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
      tag_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Install dependencies & build Svelte static frontend (web)
        script: |
          cd web
          npm install --legacy-peer-deps
          export NODE_OPTIONS="--max-old-space-size=6144"
          RAW_NUM="${BUILD_NUMBER:-${PROJECT_BUILD_NUMBER:-0}}"
          if [ "$RAW_NUM" -lt 6000 ] 2>/dev/null; then BUILD_NUM=$((6000 + RAW_NUM)); else BUILD_NUM="$RAW_NUM"; fi
          export VITE_APP_VERSION="3.1.${BUILD_NUM}"
          # No pre-compressed .gz siblings: they bloat the bundle and Android
          # AAPT2 (same dist) rejects them as duplicate resources.
          COMPRESS_ASSETS=0 npm run build
      - name: Sync Capacitor iOS project
        script: |
          cd mobile
          npm install
          npx cap sync ios
      - name: Configure iOS version & build number
        script: |
          RAW_NUM="${BUILD_NUMBER:-${PROJECT_BUILD_NUMBER:-1}}"
          if [ "$RAW_NUM" -lt 6000 ] 2>/dev/null; then BUILD_NUM=$((6000 + RAW_NUM)); else BUILD_NUM="$RAW_NUM"; fi
          echo "Setting iOS Marketing Version to 3.1.0 and Build Number to $BUILD_NUM"
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = 3.1.0;/g" mobile/ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = ${BUILD_NUM};/g" mobile/ios/App/App.xcodeproj/project.pbxproj
          cd mobile/ios/App
          agvtool new-marketing-version "3.1.0" || true
          agvtool new-version -all "$BUILD_NUM" || true
      - name: Install CocoaPods
        script: |
          cd mobile/ios/App
          pod install
      - name: Fetch or create fresh App Store provisioning profile
        script: |
          set -e
          PROF_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          XCODE_PROF_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROF_DIR" "$XCODE_PROF_DIR"
          rm -f "$PROF_DIR"/*.mobileprovision "$XCODE_PROF_DIR"/*.mobileprovision
          BUNDLE_RES_ID=$(app-store-connect bundle-ids list \
            --bundle-id-identifier "net.onmydisk.app" \
            --strict-match-identifier \
            --json | jq -r '.[0].id')
          echo "Resolved Bundle ID resource: $BUNDLE_RES_ID"
          test -n "$BUNDLE_RES_ID" && [ "$BUNDLE_RES_ID" != "null" ]
          app-store-connect bundle-ids enable-capabilities "$BUNDLE_RES_ID" \
            --capability "Sign In with Apple" "Push Notifications" || true
          CERT_RES_ID=$(app-store-connect certificates list \
            --type DISTRIBUTION \
            --json | jq -r '(.[] | select(.attributes.serialNumber == "5FF54BFD8635F49D785057CE4ED49BE4") | .id), .[0].id' | head -n 1)
          echo "Resolved Distribution Certificate resource: $CERT_RES_ID"
          test -n "$CERT_RES_ID" && [ "$CERT_RES_ID" != "null" ]
          app-store-connect profiles list \
            --type IOS_APP_STORE \
            --state ACTIVE \
            --profiles-dir "$PROF_DIR" \
            --save \
            --json >/dev/null
          MATCHED_PROFILE=""
          for p in "$PROF_DIR"/*.mobileprovision; do
            [ -f "$p" ] || continue
            PLIST=$(security cms -D -i "$p" 2>/dev/null || true)
            if echo "$PLIST" | grep -q "<string>UMAS9T29TH.net.onmydisk.app</string>" \
               && echo "$PLIST" | grep -q "<key>aps-environment</key>" \
               && echo "$PLIST" | grep -q "<key>com.apple.developer.applesignin</key>"; then
              MATCHED_PROFILE="$p"
              echo "Found valid ACTIVE profile with aps-environment & applesignin: $p"
            else
              rm -f "$p"
            fi
          done
          if [ -z "$MATCHED_PROFILE" ]; then
            echo "Creating new ACTIVE IOS_APP_STORE profile on Apple Developer Portal..."
            app-store-connect profiles create "$BUNDLE_RES_ID" \
              --certificate-ids "$CERT_RES_ID" \
              --type IOS_APP_STORE \
              --profiles-dir "$PROF_DIR" \
              --save
            MATCHED_PROFILE=$(ls "$PROF_DIR"/*.mobileprovision | head -n 1)
          fi
          cp "$MATCHED_PROFILE" "$XCODE_PROF_DIR/"
          ls -la "$PROF_DIR" "$XCODE_PROF_DIR"
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build IPA for App Store / TestFlight
        script: |
          set -e
          cd mobile/ios/App
          xcode-project build-ipa \
            --workspace App.xcworkspace \
            --scheme App
          if [ -f "build/ios/ipa/App.ipa" ]; then
            mv build/ios/ipa/App.ipa build/ios/ipa/DiskDirect.ipa
            echo "Renamed output to DiskDirect.ipa"
          fi
          test -f "build/ios/ipa/DiskDirect.ipa"
    artifacts:
      - mobile/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - alexey@volkoff.info
        notify:
          failure: true
          success: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  macos-node-workflow:
    name: Disk Direct macOS Node & Tunnel
    max_build_duration: 45
    instance_type: mac_mini_m2
    triggering:
      events: []
    scripts:
      - name: Install Homebrew dependencies (qt@5, openssl@3, cmake)
        script: |
          set -e
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install qt@5 openssl@3 cmake
      - name: Build self-contained macOS arm64 Node & Tunnel bundle
        script: |
          set -e
          cd core
          chmod +x Node/deploy/build-macos-embedded.sh
          ./Node/deploy/build-macos-embedded.sh
    artifacts:
      - core/dist/onmydisk-node-macos-*.tar.gz

