title: "Disk Direct Documentation"
email: info@disk.direct
description: >-
  Official documentation for Disk Direct & AI Assistant Direct —
  decentralized peer-to-peer personal cloud, Knowledge Base (RAG), and private AI workspace.
url: "https://docs.disk.direct"
baseurl: ""

logo: "/images/logo.svg"
favicon_ico: "/favicon.ico"
color_scheme: direct
search_enabled: true

aux_links:
  "Open Disk Direct":
    - "https://disk.direct"
  "AI Assistant":
    - "https://aiassistant.direct"
  "GitHub":
    - "https://github.com/alexeyvolkoff/direct"
aux_links_new_tab: true

footer_content: "Copyright &copy; 2026 Disk Direct &middot; Open-source under Apache-2.0."

port: 4005
theme: "just-the-docs"
plugins:
  - jekyll-feed
  - jekyll-seo-tag

callouts_level: quiet
callouts:
  note:
    title: Note
    color: purple
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: blue
  warning:
    title: Warning
    color: yellow
